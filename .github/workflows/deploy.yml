# Publish the editor to GitHub Pages at https://kfxs.github.io/opus-editor/.
#
# The URL's `/opus-editor/` path IS `base` in vite.config.ts — a project Pages site is served from
# a subdirectory, so every asset URL has to carry that prefix. If this repo is ever renamed, the
# base has to be renamed with it or the built page will ask for its assets at the wrong path.
#
# The artifact deploy (upload-pages-artifact → deploy-pages) publishes `dist/` as-is: no Jekyll, no
# branch to keep in sync, nothing committed back to the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run by hand from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` on purpose: a running deploy is finished rather
# than abandoned half-published, and the newer commit simply queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # TEMPORARY, and the whole point of it. `npm ci` failed here because the runner's npm and the
      # npm that writes the lockfile disagree about whether rolldown's optional wasm32 binding needs
      # @emnapi/* entries — and that version is not knowable from a laptop. Read it off a run, then
      # regenerate the lock with `npx npm@<that version> install --package-lock-only`, restore
      # `npm ci` below, and delete this step.
      - run: node -v && npm -v

      # `npm install`, not `npm ci`. The stricter command is the usual CI idiom, but it demands the
      # lockfile account for the tree EXACTLY, and npm will not produce such a lock here: rolldown's
      # optional wasm32 fallback binding has peer deps (@emnapi/*) that npm's resolver treats as
      # lock-worthy on the runner and unnecessary on this machine. Regenerating locally only moved
      # the disagreement around — a from-scratch lock deletes the very entries `npm ci` asks for.
      #
      # The lock is still honoured: `npm install` only reaches past it for what it cannot satisfy.
      - run: npm install --no-audit --no-fund

      # The project's own gate: lint:boundary + lint:testnames + lint:singletons + eslint + tsc,
      # ending in `vite build`. So this one step both checks and produces `dist/`.
      #
      # It deliberately does NOT include `npm run test:e2e` — that suite drives a real browser, and
      # build:check is kept browser-free (see CLAUDE.md §Testing).
      - run: npm run build:check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
